name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # نسخه‌ی sing-box که کانفیگ برنامه برایش نوشته شده (فرمت 1.12.x)
  SING_BOX_TAG: v1.12.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Clone sing-box
        run: git clone --depth 1 --branch "$SING_BOX_TAG" https://github.com/SagerNet/sing-box.git sing-box

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go (version from sing-box go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          find . -maxdepth 2 -name 'libbox*.aar' -print

      - name: Upload libbox.aar (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox*.aar

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter android project
        run: flutter create . --project-name red_vpn --org com.redvpn

      - name: Patch android for sing-box
        run: |
          mkdir -p android/app/libs
          cp sing-box/libbox*.aar android/app/libs/libbox.aar
          python3 scripts/patch_android.py

      - name: Build APK
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: red-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
